<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="popup.css" /></head>
<body>

  <!-- KEY ENTRY -->
  <section id="screen-key" class="screen">
    <div class="hero">
      <div class="logo">🔑</div>
      <h1>Cookie Snap</h1>
      <p class="muted">Enter your access key to continue</p>
    </div>
    <input id="key-input" placeholder="YOUR-ACCESS-KEY" spellcheck="false" autocomplete="off" />
    <button id="key-go" class="primary">Continue →</button>
    <p class="err" id="key-err"></p>
  </section>

  <!-- USER -->
  <section id="screen-user" class="screen" hidden>
    <header><div class="brand">🍪 Cookie Snap</div><button id="u-logout" class="ghost">Log out</button></header>
    <div class="pad">
      <p class="ready" id="u-ready"></p>
      <button id="u-activate" class="primary big">Activate</button>
      <p class="note" id="u-status"></p>
      <p class="note" id="u-info"></p>
    </div>
  </section>

  <!-- ADMIN -->
  <section id="screen-admin" class="screen admin" hidden>
    <aside class="side">
      <div class="side-brand"><span class="dot"></span>Admin</div>
      <button class="tab active" data-tab="dash">Dashboard</button>
      <button class="tab" data-tab="add">Add Cookies</button>
      <button class="tab" data-tab="users">Users</button>
      <button class="tab" data-tab="settings">Settings</button>
      <div class="spacer"></div>
      <button id="a-logout" class="tab">Log out</button>
    </aside>

    <main class="content">
      <div class="pane" id="pane-dash">
        <h2>Dashboard</h2>
        <div class="stats">
          <div class="stat"><b id="st-total">0</b><span>Keys</span></div>
          <div class="stat"><b id="st-active">0</b><span>Active</span></div>
          <div class="stat"><b id="st-hits">0</b><span>Uses</span></div>
        </div>
        <h3 class="sub">Recent keys</h3>
        <div id="recent" class="list"></div>
      </div>

      <div class="pane" id="pane-add" hidden>
        <h2 id="add-title">Add cookies</h2>
        <p class="muted">Site name, domain, cookies, and the key to assign.</p>
        <label>Site name<input id="a-name" placeholder="e.g. Netflix" /></label>
        <label>Domain<input id="a-domain" placeholder="auto-detected" /></label>
        <label>Cookies<textarea id="a-cookies" placeholder="Paste any cookie format…"></textarea></label>
        <label>Key</label>
        <div class="row">
          <input id="a-key" placeholder="leave blank to auto-generate" spellcheck="false" />
          <button id="a-gen" class="ghost">Generate</button>
        </div>
        <button id="a-save" class="primary">Save</button>
        <button id="a-cancel" class="ghost" hidden>Cancel edit</button>
        <p class="err" id="a-status"></p>
      </div>

      <div class="pane" id="pane-users" hidden>
        <h2>Users</h2>
        <input id="u-search" placeholder="Search…" />
        <div id="users" class="list"></div>
      </div>

      <div class="pane" id="pane-settings" hidden>
        <h2>Settings</h2>
        <h3 class="sub">Your admin key</h3>
        <div class="row"><input id="s-adminkey" readonly /><button id="s-copy" class="ghost">Copy</button></div>
        <button id="s-regen" class="ghost">Regenerate admin key</button>
        <p class="note">Regenerating invalidates your current admin login.</p>
        <h3 class="sub">Export</h3>
        <button id="s-export" class="ghost">Download all keys (JSON)</button>
      </div>
    </main>
  </section>

  <div id="toast" hidden></div>
</body>
<script type="module" src="popup.js"></script>
</html>
