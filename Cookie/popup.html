<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="popup.css" /></head>
<body>
  <div id="loader" class="loader" hidden><div class="spin"></div></div>
  <div id="toast" class="toast" hidden></div>

  <!-- KEY -->
  <section id="screen-key" class="screen">
    <div class="hero">
      <div class="logo">🔑</div>
      <h1>Cookie Snap</h1>
      <p class="muted">Enter your access key</p>
    </div>
    <div class="pad">
      <input id="key-input" placeholder="YOUR-ACCESS-KEY" spellcheck="false" autocomplete="off" />
      <button id="key-go" class="primary">Continue</button>
      <p class="err" id="key-err"></p>
    </div>
  </section>

  <!-- USER -->
  <section id="screen-user" class="screen" hidden>
    <header>
      <div class="brand"><span class="dot ok"></span>Cookie Snap</div>
      <button id="u-logout" class="ghost sm">Log out</button>
    </header>
    <div class="tabs" id="site-tabs"></div>
    <div class="pad" id="site-body"></div>
  </section>

  <!-- ADMIN -->
  <section id="screen-admin" class="screen admin" hidden>
    <aside class="side">
      <div class="side-brand"><span class="dot ok"></span>Admin</div>
      <button class="tab active" data-tab="dash">Dashboard</button>
      <button class="tab" data-tab="add">Add Cookies</button>
      <button class="tab" data-tab="users">Users</button>
      <button class="tab" data-tab="settings">Settings</button>
      <div class="spacer"></div>
      <button id="a-logout" class="tab">Log out</button>
    </aside>

    <main class="content">
      <div class="pane" id="pane-dash">
        <h2>Dashboard</h2>
        <div class="stats">
          <div class="stat"><b id="st-total">0</b><span>Keys</span></div>
          <div class="stat"><b id="st-active">0</b><span>Active</span></div>
          <div class="stat"><b id="st-dev">0</b><span>Devices</span></div>
        </div>
        <h3 class="sub">Recent</h3>
        <div id="recent" class="list"></div>
      </div>

      <div class="pane" id="pane-add" hidden>
        <h2 id="add-title">Create key</h2>
        <p class="muted">One key can hold many sites.</p>
        <label>Key</label>
        <div class="row">
          <input id="a-key" placeholder="auto-generate" spellcheck="false" />
          <button id="a-gen" class="ghost">Generate</button>
        </div>
        <label>End date (optional)<input id="a-expiry" type="date" /></label>
        <div id="a-sites"></div>
        <button id="a-addsite" class="ghost">+ Add another site</button>
        <button id="a-save" class="primary">Save key</button>
        <button id="a-cancel" class="ghost" hidden>Cancel edit</button>
        <p class="err" id="a-status"></p>
      </div>

      <div class="pane" id="pane-users" hidden>
        <h2>Users</h2>
        <input id="u-search" placeholder="Search…" />
        <div id="users" class="list"></div>
      </div>

      <div class="pane" id="pane-settings" hidden>
        <h2>Settings</h2>
        <h3 class="sub">Admin key</h3>
        <div class="row"><input id="s-adminkey" readonly /><button id="s-copy" class="ghost">Copy</button></div>
        <p class="note" id="s-devices"></p>
        <button id="s-resetdev" class="ghost">Reset admin devices</button>
        <button id="s-regen" class="ghost">Regenerate admin key</button>
        <h3 class="sub">Export</h3>
        <button id="s-export" class="ghost">Download all keys</button>
      </div>
    </main>
  </section>
</body>
<script type="module" src="popup.js"></script>
</html>
