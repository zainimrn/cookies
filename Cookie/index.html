<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">Cookie Snap</div>
    <div class="sub" id="siteLine">—</div>
  </header>

  <div class="bar">
    <input id="domain" type="text" placeholder="auto-detect from cookies" spellcheck="false" />
    <button id="loadBtn">Load</button>
    <button id="reloadBtn" title="Reload the page">↻</button>
  </div>

  <div class="bar">
    <label class="fmt">Format
      <select id="format">
        <option value="json">JSON</option>
        <option value="netscape">Netscape (cookies.txt)</option>
        <option value="setcookie">Set-Cookie lines</option>
        <option value="header">Cookie header</option>
        <option value="base64">Base64 JSON</option>
      </select>
    </label>
  </div>

  <div class="bar">
    <button id="exportBtn" class="primary">Export</button>
    <button id="importBtn">Import</button>
    <button id="deleteBtn" class="danger">Delete All</button>
  </div>

  <div id="importArea" hidden>
    <div class="hint">Works from any tab. Paste cookies — the site is detected automatically.</div>
    <textarea id="importText" placeholder="Paste cookies (JSON, cookies.txt, Set-Cookie, header, base64)…"></textarea>

    <label class="opt"><input type="checkbox" id="optRenew" checked /> Renew expired cookies</label>
    <label class="opt"><input type="checkbox" id="optPersist" checked /> Convert session cookies to persistent</label>
    <label class="opt"><input type="checkbox" id="optClear" checked /> Clear existing site cookies first</label>
    <label class="opt"><input type="checkbox" id="optOpen" checked /> Open the site after import</label>
    <label class="opt">Renew for <input id="optDays" type="number" min="1" value="365" /> days</label>

    <div class="bar">
      <button id="fileBtn">Choose file…</button>
      <button id="importRun" class="primary">Import &amp; Go</button>
    </div>
    <input id="file" type="file" hidden />
  </div>

  <div class="listHead">
    <label><input type="checkbox" id="selectAll" checked /> All</label>
    <span id="count">0 cookies</span>
  </div>

  <ul id="list"></ul>
  <div id="toast" hidden></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
